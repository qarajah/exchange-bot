<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{headLogo}}">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">

</head>

<main role="main" class="container-md">
    <body style="background:black">
        <div id="vue-app" style="background:black">
            <div :class="getMargin()" id="tradingdesk">



                <table class="table table-dark" class="table-responsive">
                    <thead>
                    <tr>
                        <th scope="col" colspan='3' ><h3 style="color:white">Bot Dashboard</h3></th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr>

                        </tr>
                        <tr>
                            <th class="" scope="row"><span @click="">Exchange</span> </th>
                            <td class="" style="color:#C97CFE " scope="row"><span @click="">Bybit</span> </td>
                        </tr>
                        <tr>
                            <th class="" scope="row"><span @click="">Funds </span> </th>
                            <td class="text-warning" scope="row"><span>  </span> [[funds]] </td>
                            <td class="text-warning" scope="row"><span @click="">Open Positions %</span> </td>
                            <td class="text-warning" scope="row"><span > Tot Allocations %</span> </td>
                        </tr>

                        <tr>
                            <td>
                                <button @click="getData()" type="button" class="btn btn btn-secondary"> [[API]] </button>
                            </td>
                            <td class="" scope="row"><span @click="">Auth Code</span></td>
                            <td>
                                <input type="number" style="width:50%" class="bg-dark text-white" v-model="passcode"> </input>
                            </td>
                        </tr>

                    </tbody>

                </table>

                <table class="table table-dark" class="table-responsive">
                    <thead>
                    <tr>
                        <th scope="col" style="width:10%">Trade</th>
                        <th scope="col" style="width:10%">Side</th>
                        <th scope="col" style="width:15%">PNL</th>
                        <th scope="col" style="width:15%">Entry</th>
                        <th scope="col" style="width:15%">Stop</th>
                        <th scope="col" style="width:15%">Profit</th>
                        <th scope="col" style="width:15%">Lev</th>
                        <th scope="col" style="width:15%"></th>
                    </tr>
                    </thead>
                    <tbody>
                        <template v-for="(item, ticker) in assets" :key="ticker" >
                            <tr class="">
                                <th class= "text-xsmall" :style="getAssetColor(ticker)" @click="showAsset=ticker" scope="row"><span>[[ticker.toUpperCase().split('USDT')[0] ]]</span> </th>
                                <td :class="getSideColor(item.side)" ><span>[[item.side]]</span></td>
                                <td class="" ><span>[[item.gains]]</span></td>
                                <td class="" ><span>[[item.entry]]</span></td>
                                <td class="" ><span>[[item.stop]]</span></td>
                                <td class="" ><span>[[item.profit]]</span></td>
                                <td class="" ><span>[[item.lev]]</span></td>

                            </tr>
                            <tr v-if="showAsset == ticker">
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'stop-reduce', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-danger">
                                        <span> SL -50% </span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'stop-break', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-danger">
                                        <span> SL 0% </span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'stop-profit', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-danger">
                                        <span> SL +50% </span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'profit-reduce', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-success">
                                        <span> TP -50%</span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'profit-prop', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-success">
                                        <span> TP 2:1</span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'profit-vwap', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-success">
                                        <span> TP V</span>
                                    </button>
                                </td>
                                <td class="">
                                    <button @click="adjustOrder(ticker, 'profit-cancel', item.stop, item.profit, item.entry, item.side)" type="button" class="btn btn-sm btn-safe">
                                        <span> TP X</span>
                                    </button>
                                </td>
                            </tr>

                            <template v-for="(order, key) in orders[ticker]" :key="key" >
                                <tr v-if="order.reduce && showAsset == ticker">
                                    <th class= "text-xsmall" :style="getAssetColor(ticker)" scope="row"><span>[[ticker.toUpperCase().split('USDT')[0] ]]</span> </th>
                                    <td :class="getSideColor(order.side)"><span>[[order.side]]</span></td>
                                    <td class="" ><span>[[order.entry]] ([[getDistance(order.entry, order.last_price)]])</span></td>
                                    <td class="" ><span></span></td>
                                    <td class="" ><span></span></td>
                                    <td class="" ><span></span></td>
                                    <td class="" ><span></span></td>
                                    <td class="">
                                        <button @click="cancelOrder(ticker, order.id)" type="button" class="btn btn btn-danger">
                                            <span> X </span>
                                        </button>
                                    </td>
                                </tr>
                            </template>


                        </template>
                    </tbody>


                </table>
                <br>

                <table class="table table-dark" class="table-responsive">
                    <thead>
                    <tr>
                        <th scope="col" style="width:10%">Asset</th>
                        <th scope="col" style="width:10%">Side</th>
                        <th scope="col" style="width:15%">Entry</th>
                        <th scope="col" style="width:15%">Stop</th>
                        <th scope="col" style="width:15%">Profit</th>
                        <th scope="col" style="width:15%">Last</th>
                        <th scope="col" style="width:15%">Size</th>
                        <th scope="col" style="width:15%">C</th>
                        <th scope="col"> </th>
                    </tr>
                    </thead>
                    <tbody>
                        <template v-for="(items, ticker) in orders" :key="ticker" >
                            <template v-for="(item, key) in items" :key="key" >
                                <tr v-if="!item.reduce">
                                    <th class= "text-xsmall" :style="getAssetColor(ticker)" scope="row"><span>[[ticker.toUpperCase().split('USDT')[0] ]]</span> </th>
                                    <td :class="getSideColor(item.side)"><span>[[item.side]]</span></td>
                                    <td class="" ><span>[[item.entry]] ([[getDistance(item.entry, item.last_price)]])</span></td>
                                    <td class="" ><span>[[item.stop]]</span></td>
                                    <td class="" ><span>[[item.profit]]</span></td>
                                    <td class="" ><span>[[item.last_price]]</span></td>
                                    <td class="" ><span>[[Math.round(item.entry * item.qty)]]</span></td>
                                    <td class="">
                                        <button @click="cancelOrder(ticker, item.id)" type="button" class="btn btn btn-danger">
                                            <span> X </span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </template>

                    </tbody>
                </table>
                <br>














            </div> <!-- end trading desk-->

        </div> <!-- end vue app-->
    </body>
</main>

{% block script %}
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vue@2.6.11"></script>


<script type="text/javascript">

var report = navigator.userAgent
// console.log(report)

let mobile = false

if (report.includes('Android') || report.includes('iPhone') ) {
    mobile = true
    console.log('mobile')
}

startVue()


function startVue(){

let vue = new Vue({

    el: '#vue-app',
    delimiters: ['[[', ']]'],
    mounted: function() {
        let code = localStorage.getItem('code')

        if (code) {
            this.passcode = code
            localStorage.removeItem("code")
            this.getData()
        }


    },
    data: {
        mobile : mobile,
        API : 'API',
        exchange: '',
        rows: 100,
        alerts: [],
        trades: [],
        funds: 0,
        misc: [],
        open: 0,
        liquidation: '',
        stop: '',
        passcode: 0,
        assets: {},
        orders: {},
        errors: {},
        editAsset: '',
        totalProp: 0,
        showMisc: false,
        showData: '--',
        showAssetData: false,
        showAsset: '',
        showNotes: false,
        assetDelete: '',
        parameters: {
            lev : '',
            stop : '',
            prop : ''
        },
        usernotes: {
        }
    },
    methods: {
        cancelOrder: function (asset, id) {
            console.log(asset, id)
            $.ajax({
                data : {
                    pw: this.passcode,
                    sym : asset,
                    id : id
                },
                type : 'POST',
                url : '/cancelOrder'
            })
            .done(function(data) {
                console.log(data)
                vue.getData()
            })
            .fail(function(){
                  alert('error has occurred cancelOrder');
            });
        },
        adjustOrder: function (key, mode, stop, profit, entry, side) {
            $.ajax({
                data : {
                    pw: this.passcode,
                    _sym : key,
                    _mode : mode,
                    _stop : stop,
                    _profit : profit,
                    _entry : entry,
                    _side : side
                },
                type : 'POST',
                url : '/adjustOrder'
            })
            .done(function(data) {
                result = JSON.parse(data)
                console.log(result)
                alert(JSON.stringify(result.response))
                vue.getData()
            })
            .fail(function(){
                  alert('error has occurred adjustOrder');
            });
        },
        getDistance: function(a,b){
            dis = (a-b)/a
            per = Math.round(dis*1000)/10
            return per

        },
        getFunds: function () {
            let string = '$' + this.funds[1] + ' (' + this.funds[2] + ')'
            return string
        },
        getSum: function (asset, mode) {
            let a = this.assets[asset]
            return a[mode].length

        },
        toggleData: function (asset) {
            this.showAsset = asset
            if (this.showData == '--') {
                this.showData = 'Webhooks'
            } else if (this.showData == 'Webhooks') {
                this.showData = 'Trades'
            } else if (this.showData == 'Trades') {
                this.showData = 'Errors'
            } else {
                this.showData = '--'
            }
        },
        checkLev: function (params, sameLev, assetOBJ) {
            if (this.editAsset != '' && !sameLev){
                // console.log(params['lev'])
                if (params['position'] == 'short' || params['position'] == 'long') {
                    alert('Cannot change leverage while position is open\nplease close position and make sure leverage on exchange and bot is the same')
                    return false
                }
                if (params['lev'] < 2) {
                    alert('Levarage should be > 1')
                    return false
                }
                if (this.checkStop(params, false, assetOBJ)) {}
            }
            return true
        },
        goTo: function(link){

            var str = window.location.href.split('trade')[0]

            let url = str + link

            // console.log('goTO', url);
            window.location = url
        },
        getMargin: function () {
            if (this.mobile) {
                return ""
            } else {
                return "content-section m-5 bg-dark rounded"
            }
        },
        getTradeDiv: function () {
            if (this.mobile) {
                return "align-items-start m-0 rounded"
            } else {
                return "row align-items-start m-1 rounded"
            }
        },
        getAssetColor: function (asset) {
            let styles = {
                1 : {color:'cyan'},
                2 : {color:'lime'},
                3 : {color:'#FFFF00'},
                4 : {color:'#FF00FF'},
                5 : {color:'cyan'},
                6 : {color:'lime'},
                7 : {color:'#FFFF00'},
                8 : {color:'#FF00FF'}
            }
            let count = 1
            for (let a in this.assets) {
                if (a == asset) {
                    return styles[count]
                }
                count += 1
            }
            return {color:'white'}
        },
        getSideColor: function (side) {
            console.log(side)
            let sideClass = {
                Buy : "text-success text-uppercase font-weight-bold",
                Sell : "text-danger text-uppercase font-weight-bold"
            }
            return sideClass[side]
        },
        getLevStyle: function (lev, lastlev) {
            if (lastlev && lev != lastlev) {
                return 'background:#851600'
            }
        },
        getData: function () {
            this.API = 'Accessing API...'
            // console.log('getData')

            $.ajax({
                data : {
                    pw: this.passcode
                },
                type : 'POST',
                url : '/getData'

            })
            .done(function(data) {
                // console.log(data)
                if (data.error) {
                    vue.API = 'API'
                    alert(data.error)
                    //localStorage.setItem('code', null)
                    return false
                } else {
                    //vue.getAssets()
                    parseData = JSON.parse(data)
                    vue.funds = parseData.funds
                    console.log(parseData)
                    vue.assets = parseData.assets
                    vue.orders = parseData.orders
                    localStorage.setItem('code', vue.passcode )
                    vue.API = 'API'
                }
            })
            .fail(function(){
                  alert('error has occurred getFunds');
            });
        },
        getAssets: function () {
            // console.log('getAssets')


            $.ajax({
                data : {
                    pw: this.passcode
                },
                type : 'POST',
                url : '/getAssets'

            })
            .done(function(data) {
                // console.log(data)
                if (data.error) {
                    vue.API = 'API'
                    return false
                }
                parseData = JSON.parse(data)
                console.log(parseData)
                vue.assets = parseData
                vue.API = 'API'
            })
            .fail(function(){
                  alert('error has occurred getAssets');
            });
        },
        authDelete: function (asset) {
            // console.log('authDelete', this.assetDelete)

            $.ajax({
                data : {
                    pw: this.passcode,
                    asset: asset
                },
                type : 'POST',
                url : '/deleteAsset'

            })
            .done(function(data) {
                if (data.error) {
                    alert(data.error)
                    console.log(data.error)
                    vue.editAsset = ''
                } else {
                    localStorage.setItem('code', vue.passcode)
                    location.reload()
                }
            })
            .fail(function(){
                  alert('error has occurred deleteAsset');
            });
        },
        miscDelete: function () {
            // console.log('authDelete', this.assetDelete)

            $.ajax({
                data : {
                    pw: this.passcode
                },
                type : 'POST',
                url : '/deleteMisc'

            })
            .done(function(data) {
                if (data.error) {
                    alert(data.error)
                    console.log(data.error)
                } else {
                    localStorage.setItem('code', vue.passcode)
                    location.reload()
                }
            })
            .fail(function(){
                  alert('error has occurred deleteAsset');
            });
        }
    },
    computed: {
        calcOpenTotal() {
            let open = 0
            for (let a in this.assets) {
                if (this.assets[a]['position']) {
                    open += this.assets[a]['lastprop']
                }
            }
            return open
        },
        calcAllo() {
            let allo = 0
            for (let a in this.assets) {
                allo += this.assets[a]['prop']
            }
            return allo
        }
    },
    watch: {
        editAsset: function () {
            if (this.editAsset == '') {
                this.parameters = {
                    lev : '',
                    stop : '',
                    prop : '',
                    position : '',
                }
            } else {
                asset = this.assets[this.editAsset]
                this.parameters['lev'] = asset['lev']
                this.parameters['stop'] = asset['stop']
                this.parameters['prop'] = asset['prop']
                this.parameters['position'] = asset['position']
            }
        }
    }

})// end NEW VUE

}


</script>



{% endblock %}
